name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-approve:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.25.0, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: astral-sh/setup-uv@v6
        with: { version: 0.7.19, python-version: 3.13.5 }
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project apps/worker --locked
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:contracts
      - run: pnpm test:security
      - run: pnpm test:integration
      - run: pnpm lint:worker
      - run: pnpm test:worker
      - name: Hosted Supabase migration dry run
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ]; then echo "Hosted Supabase staging is not configured; dry run deferred."; exit 0; fi
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --dry-run
      - name: Hosted Supabase acceptance checks
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ]; then echo "Hosted Supabase staging is not configured; acceptance checks deferred."; exit 0; fi
          supabase test db --linked
      - name: Worker canary
        run: uv run --project apps/worker pytest -c apps/worker/pytest.ini --rootdir=apps/worker apps/worker/tests/test_health.py apps/worker/tests/test_ingestion_pipeline.py
      - run: pnpm test:ai-evals
      - run: pnpm build
      - name: Human production approval
        run: echo "Promotion is gated by the protected production environment."
