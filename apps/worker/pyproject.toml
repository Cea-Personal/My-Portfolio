[project]
name = "career-worker"
version = "0.1.0"
description = "Isolated document and AI workflow worker for AI Career OS"
requires-python = ">=3.13.5,<3.14"
dependencies = [
  "httpx==0.28.1",
  "inngest==0.5.13",
  "pydantic==2.12.4",
  "pypdf==6.4.0",
  "python-docx==1.2.0",
]

[project.scripts]
career-worker = "career_worker.__main__:main"

[dependency-groups]
dev = [
  "mypy==1.18.2",
  "pytest==9.0.1",
  "pytest-asyncio==1.3.0",
  "pytest-cov==7.0.0",
  "ruff==0.14.7",
]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/career_worker"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers --cov=career_worker --cov-report=term-missing"
asyncio_mode = "strict"
