receivers:
  otlp:
    protocols:
      grpc:
      http:

processors:
  attributes/privacy:
    actions:
      - key: enduser.id
        action: delete
      - key: http.url
        action: delete
      - key: url.query
        action: delete
      - key: gen_ai.prompt
        action: delete
      - key: gen_ai.completion
        action: delete
  filter/allowlist:
    error_mode: ignore
    traces:
      span:
        - 'attributes["career.private_content"] != nil'
  batch:

exporters:
  debug:
    verbosity: basic

service:
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/privacy, filter/allowlist, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [attributes/privacy, batch]
      exporters: [debug]
